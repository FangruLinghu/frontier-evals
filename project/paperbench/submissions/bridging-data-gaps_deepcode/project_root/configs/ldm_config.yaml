# LDM (Latent Diffusion Model) configuration for DPMs-ANT training (Phase 1)
# Mirrors the DDPM config structure but tuned for LDM backbones.

seed: 42
device: "cpu"

data:
  source_root: "data/source"
  target_root: "data/target"
  image_size: 128
  num_shots: 10
  augment: true
  augmentation: {}

model:
  backbone: "ldm"
  ldm:
    latent_dim: 32
    pretrained_path: null
    frozen: true
  adaptor:
    gamma: 5.0
    omega: 0.02
    J: 10
    lr: 5e-05
  bottleneck_variants:
    ddpm:
      c: 4
      d: 8
    ldm:
      c: 2
      d: 8

data_processing:
  normalize: true
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]

training:
  max_steps: 300
  batch_size: 16
  gradient_accumulation_steps: 1
  log_every: 50
  save_every: 200
  eval_every: 100
  deterministic: true
  seed: 42

schedules:
  T: 1000
  beta_schedule: "linear"
  schedule_device: "cpu"

evaluation:
  metrics: ["fid", "intra_lpips"]
  num_eval_samples: 100
  fid_target_size: 64
  save_generated_images: false

logging:
  experiment_name: "ldm_phase1"
  log_dir: "logs/ldm"
  verbose: true

checkpoints:
  dir: "checkpoints/ldm"
  resume_from: null
  save_best_only: false
