# Base configuration for DPMs-ANT experiments
# This file provides sensible defaults used across backbones (DDPM and LDM)

seed: 42
device: "cuda"  # or "cpu" if CUDA is unavailable

data:
  source_root: data/source
  target_root: data/target
  image_size: 128           # default image resolution used for preprocessing
  num_shots: 10              # 10-shot target protocol
  augment: true
  augmentation:                  # lightweight augmentation specs (optional)
    resize: 128
    flip: true
    color_jitter: [0.25, 0.25, 0.25, 0.05]

model:
  backbone: "ddpm"  # options: ddpm, ldm
  ddpm:
    pretrained_path: null
    frozen: true        # θ is frozen during adaptor training
  ldm:
    latent_dim: 32
    pretrained_path: null
  adaptor:
    gamma: 5.0
    omega: 0.02
    J: 10
    lr: 0.0005
    # Bottleneck per-backbone configuration (c, d)
    bottleneck_variants:
      ddpm: {c: 4, d: 8}
      ldm: {c: 2, d: 8}

data_processing:
  normalize: true
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]

training:
  max_steps: 1000              # total outer training iterations (can be ~300 for ANT per paper guidance)
  batch_size: 40               # per iteration batch size
  gradient_accumulation_steps: 1
  log_every: 10
  save_every: 200
  eval_every: 100
  deterministic: true
  seed: 42

schedules:
  T: 1000
  beta_schedule: "linear"       # options: linear, cosine (DDPM v2 style)
  schedule_device: "cuda"

evaluation:
  metrics: ["fid", "intra_lpips"]
  num_eval_samples: 32
  fid_target_size: 64
  save_generated_images: true

logging:
  experiment_name: "default_experiment"
  log_dir: logs/
  verbose: false

checkpoints:
  dir: checkpoints/
  resume_from: null
  save_best_only: false
