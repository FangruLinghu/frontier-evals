# DDPM-specific configuration for DPMs-ANT (phase-specific adaptation)

model:
  backbone: "ddpm"
  ddpm:
    pretrained_path: null        # Path to pre-trained DDPM weights; null to use defaults
    frozen: true                 # Freeze backbone θ during adaptor training
  adaptor:
    gamma: 5.0                   # Similarity guidance weight (Eq. 5)
    omega: 0.02                  # Inner-max step size (Eq. 6)
    J: 10                        # Inner-max iterations (Eq. 7)
    lr: 5e-05                   # Adaptor learning rate
  bottleneck_variants:
    ddpm:
      c: 4
      d: 8
    ldm:
      c: 2
      d: 8

data:
  source_root: "data/source"
  target_root: "data/target"
  image_size: 128
  num_shots: 10
  augment: true
  augmentation: {}

training:
  max_steps: 300                 # Approximate adaptor training iterations per target
  batch_size: 16
  gradient_accumulation_steps: 1
  log_every: 50
  save_every: 200
  eval_every: 100
  deterministic: true
  seed: 42

schedules:
  T: 1000
  beta_schedule: "linear"
  schedule_device: "cpu"

evaluation:
  metrics: ["fid", "intra_lpips"]
  num_eval_samples: 100
  fid_target_size: 64
  save_generated_images: false

logging:
  experiment_name: "ddpm_phase1"
  log_dir: "logs/ddpm"
  verbose: true

checkpoints:
  dir: "checkpoints/ddpm"
  resume_from: null
  save_best_only: false
