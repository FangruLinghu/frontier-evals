# Default configuration for Simformer training
# Based on paper specifications

# Model architecture
model:
  token_dim: 50
  n_layers: 6  # Use 8 for complex tasks (LV, SIRD, HH)
  n_heads: 4
  widening_factor: 3
  time_embed_dim: 128
  dropout: 0.0

# SDE configuration
sde:
  type: vesde  # or vpsde
  # VESDE parameters
  sigma_min: 0.0001
  sigma_max: 15.0
  # VPSDE parameters
  beta_min: 0.01
  beta_max: 10.0

# Tokenizer
tokenizer:
  identifier_type: learned  # or sinusoidal
  value_embedding: mlp  # or linear
  use_conv: false

# Training
training:
  epochs: 100
  batch_size: 1000
  samples_per_epoch: 100000
  learning_rate: 0.0001
  weight_decay: 0.0
  gradient_clip: 1.0
  warmup_steps: 1000

  # EMA
  use_ema: true
  ema_decay: 0.999

  # Checkpointing
  checkpoint_frequency: 10
  log_frequency: 10

# Diffusion sampling
sampling:
  n_steps: 500
  method: euler_maruyama
  # For guidance
  guidance_scale: 1.0

# Evaluation
evaluation:
  n_observations: 100
  n_posterior_samples: 1000
  n_diffusion_steps: 500

  # C2ST settings
  c2st_classifier: mlp
  c2st_n_folds: 5

  # Coverage settings
  coverage_levels: [0.5, 0.75, 0.9, 0.95]

# Task-specific overrides
tasks:
  gaussian_linear:
    n_layers: 6
    epochs: 50

  gaussian_mixture:
    n_layers: 6
    epochs: 50

  two_moons:
    n_layers: 6
    epochs: 100

  slcp:
    n_layers: 6
    epochs: 100

  tree:
    n_layers: 6
    epochs: 100

  hmm:
    n_layers: 6
    epochs: 100

  lotka_volterra:
    n_layers: 8
    epochs: 200

  sird:
    n_layers: 8
    epochs: 200

  hodgkin_huxley:
    n_layers: 8
    epochs: 200

# Logging
logging:
  use_wandb: false
  wandb_project: simformer
  wandb_entity: null

# Hardware
hardware:
  device: auto  # auto, cpu, cuda, mps
  seed: 42
  num_workers: 0
