# DPMs-ANT Default Configuration
# Based on paper hyperparameters

# Model architecture (guided-diffusion U-Net)
model:
  image_size: 256
  in_channels: 3
  model_channels: 128
  out_channels: 6  # mean + learned variance
  num_res_blocks: 2
  attention_resolutions: [32, 16, 8]
  channel_mult: [1, 1, 2, 2, 4, 4]
  num_heads: 4
  dropout: 0.0
  use_scale_shift_norm: true

# Adaptor configuration
adaptor:
  # For DDPM
  ddpm:
    spatial_downscale: 4  # c
    bottleneck_dim: 8     # d
  # For LDM
  ldm:
    spatial_downscale: 2  # c
    bottleneck_dim: 8     # d

# Similarity-guided training
similarity_guidance:
  gamma: 5.0  # Guidance strength

# Adversarial noise selection
adversarial_noise:
  J: 10       # Number of gradient ascent steps
  omega: 0.02 # Step size

# Training
training:
  iterations: 300
  batch_size: 40
  lr_ddpm: 5.0e-5
  lr_ldm: 1.0e-5

# Diffusion process
diffusion:
  num_timesteps: 1000
  noise_schedule: linear

# Classifier
classifier:
  model_channels: 64
  channel_mult: [1, 2, 4]
  num_res_blocks: 1
  attention_resolutions: [16, 8]
  num_heads: 4
  training_epochs: 50
  lr: 1.0e-4

# Evaluation
evaluation:
  n_generated: 1000
  ddim_steps: 50
  # Metrics: Intra-LPIPS, FID

# Datasets (10-shot few-shot generation)
datasets:
  ffhq_to_babies:
    source: ffhq
    target: babies
    n_shots: 10
  ffhq_to_sunglasses:
    source: ffhq
    target: sunglasses
    n_shots: 10
  ffhq_to_raphael:
    source: ffhq
    target: raphael
    n_shots: 10
  ffhq_to_sketches:
    source: ffhq
    target: sketches
    n_shots: 10
  ffhq_to_modigliani:
    source: ffhq
    target: modigliani
    n_shots: 10
  church_to_haunted:
    source: lsun_church
    target: haunted_houses
    n_shots: 10
  church_to_landscape:
    source: lsun_church
    target: landscape_drawings
    n_shots: 10
