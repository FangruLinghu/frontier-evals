# SimFormer model specification for joint diffusion SBI
# This config is consumed by the transformer-based joint score model.
# It defines token embeddings, transformer architecture, time conditioning, and
# ME (multi-expert) masking settings.

token_dim: 50
# Time conditioning and Fourier-style embeddings
time_encoding: true
time_emb_dim: 128

# Transformer encoder architecture
num_layers: 6        # number of encoder layers
num_heads: 4         # multi-head attention
ffn_dim: 150           # feed-forward inner dimension
dropout: 0.1           # dropout probability inside blocks
attention_dropout: 0.1 # dropout within attention
activation: gelu         # activation for FFN
positional_encoding: true  # include positional embeddings in token inputs

# ME (dependency/conditioning) mask configuration
me_mask_type: directed     # options: directed, undirected, full
me_config:
  enabled: true
  dynamic: true              # allow dynamic adaptation of masks during conditioning
  default_type: directed
  # Additional optional ME config can be extended by task-specific scripts

# Embedding and sequence settings
max_seq_len: 1024

# Cross-attention behavior
use_cross_attention: true

# Runtime/compatibility
# Note: these fields are complemented by base.yaml and task-specific configs
