# Lotka-Volterra task configuration for joint diffusion SBI

# Core metadata
task_name: lotka_volterra
base_config: ../base.yaml

task_config:
  description: "Lotka-Volterra predator-prey dynamics with a joint θ/x inference task. Includes MC masking and diffusion-based training."
  dataset_id: lotka_volterra
  observation_points: 50  # length of time series or number of observations per trajectory
  horizon: 50           # time horizon for trajectories

model_specs:
  simformer: ../model_specs/simformer.yaml

diffusion_config:
  sde_type: VPSDE
  beta_min: 0.01
  beta_max: 10.0
  sigma_min: 0.0001
  sigma_max: 15.0
  steps: 500
  t_schedule: linear
  time_encoding: true

guidance_config:
  type: interval
  constraints:
    - name: x_interval
      type: interval
      lower: 0.0
      upper: 5.0
  s_schedule: 1.0
  strength: 0.5
  eps: 0.001
  step_budget: 50

training_config:
  batch_size: 256
  epochs: 30
  lr: 0.0003
  max_grad_norm: 1.0
  seed: 0
  mc_mask_p: 0.25

data_config:
  task: lotka_volterra
  seed: 0

evaluation_config:
  metrics:
    - c2st
    - probability_flow_nll
    - calibration
  per_task_report: true

runtime_config:
  seed: 0
  devices: ["cpu"]
