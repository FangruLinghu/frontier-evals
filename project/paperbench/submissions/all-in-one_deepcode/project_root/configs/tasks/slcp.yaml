# SLCP task configuration: SLCP data sampler with linear-Gaussian mapping and mixture components

# Top-level task descriptor
task_name: slcp
base_config: ../base.yaml

# Task-specific overrides
task_config:
  description: "SLCP data sampler with linear-Gaussian mapping and mixture components for joint diffusion SBI."
  dataset_id: slcp
  observation_points: 20
  horizon: 20

model_specs:
  simformer: ../model_specs/simformer.yaml

diffusion_config:
  sde_type: VPSDE
  beta_min: 0.01
  beta_max: 10.0
  sigma_min: 0.0001
  sigma_max: 15.0
  steps: 500
  t_schedule: linear
  time_encoding: true

guidance_config:
  type: interval
  constraints:
    - name: x_interval
      type: interval
      lower: -1.0
      upper: 1.0
  s_schedule: 1.0
  strength: 0.5
  eps: 0.001
  step_budget: 50

training_config:
  batch_size: 256
  epochs: 25
  lr: 0.0003
  max_grad_norm: 1.0
  seed: 0
  mc_mask_p: 0.25

data_config:
  task: slcp
  seed: 0

evaluation_config:
  metrics: [c2st, probability_flow_nll, calibration]
  per_task_report: true

runtime_config:
  seed: 0
  devices: ["cpu"]
