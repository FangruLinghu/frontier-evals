task_name: guided_diffusion
base_config: ../base.yaml

task_config:
  description: "Gravitational Waves: high-dimensional observations with multi-detector data; end-to-end diffusion SBI on high-D x."
  dataset_id: gravitational_waves

model_specs:
  simformer: ../model_specs/simformer.yaml

diffusion_config:
  sde_type: VPSDE
  beta_min: 0.01
  beta_max: 10.0
  sigma_min: 0.0001
  sigma_max: 15.0
  steps: 600
  t_schedule: linear
  time_encoding: true

guidance_config:
  type: interval
  constraints:
    - name: x0_interval
      type: interval
      lower: -100.0
      upper: 100.0
  s_schedule: 1.0
  strength: 0.5
  eps: 0.001
  step_budget: 60

training_config:
  batch_size: 128
  epochs: 20
  lr: 0.0003
  max_grad_norm: 1.0
  seed: 0
  mc_mask_p: 0.25

data_config:
  task: gravitational_waves
  seed: 0

evaluation_config:
  metrics: [c2st, probability_flow_nll, calibration]
  per_task_report: true

runtime_config:
  seed: 0
  devices: ["cpu"]
